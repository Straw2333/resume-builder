name: Release

# 推送 v* 标签时自动构建并发布 Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: resume-windows-amd64.exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: resume-linux-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            output: resume-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 嵌入前端产物
        shell: bash
        run: |
          rm -rf server/dist
          mkdir -p server/dist
          cp -r web/dist/* server/dist/

      - name: 构建后端
        working-directory: server
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "../release/${{ matrix.output }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: release/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
